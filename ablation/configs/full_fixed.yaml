# Full model with the channel-attention reduction ratio honoured (r=16).
# Identical to full_legacy.yaml except for the CBAM variant, so the probe isolates the
# bottleneck width and nothing else.
nc: 8
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16  <- cross-attention key/value source
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 1, Conv, [1024, 1, 1]]        # 10-P5/32 <- cross-attention query source

head:
  - [[5, 10], 1, CrossAttentionBlock, [1024, 512]]  # 11
  - [-1, 1, MSCBAMFixed, [1024, 16]]  # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 13
  - [[-1, 6], 1, Concat, [1]]                       # 14
  - [-1, 2, C3k2, [512, False]]                     # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 16
  - [[-1, 4], 1, Concat, [1]]                       # 17
  - [-1, 2, C3k2, [256, False]]                     # 18
  - [-1, 1, MSCBAMFixed, [256, 16]]  # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                      # 20
  - [[-1, 15, 6], 1, Concat, [1]]                   # 21 BiFPN tri-input fusion
  - [-1, 2, C3k2, [512, False]]                     # 22
  - [-1, 1, MSCBAMFixed, [512, 16]]  # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                      # 24
  - [[-1, 12, 10], 1, Concat, [1]]                  # 25 BiFPN tri-input fusion
  - [-1, 2, C3k2, [1024, True]]                     # 26
  - [-1, 1, MSCBAMFixed, [1024, 16]]  # 27 (P5/32-large)

  - [[19, 23, 27], 1, OBB, [nc, 1]]
