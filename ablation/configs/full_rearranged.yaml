# Same blocks as full_fixed.yaml, placed against the measured box statistics.
#
# 53% of MLT-2019 instances are under 8px tall at 480px input, so the P3/8 level
# carries the detection burden. Three placement changes follow from that:
#
#  1. Cross-attention is reversed. The query now comes from P3 (60x60), which holds
#     the small-text detail, and the key/value from the C2PSA P5 output (15x15),
#     which holds semantics. Previously the deep level queried the shallow one, so
#     the enriched tensor lived at 15x15 and reached P3 only after upsampling.
#     Identical attention FLOPs; embed_dim drops 512 -> 128, saving ~0.98M params.
#  2. MS-CBAM is dropped at P5. On a 15x15 map the 3/5/7 kernels span 20/33/47% of
#     the field, so the branches are near-duplicates and "multi-scale" is vacuous.
#     At P3 they span 5/8/12%, which is where the design actually differentiates.
#  3. C2PSA is restored. full_legacy.yaml replaced it with a 1x1 Conv, which drops
#     YOLOv11's own attention block and breaks pretrained weight transfer at P5.
#     Restoring it also makes Section III-B's description true.
nc: 8
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10-P5 semantic source

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, False]]                  # 13 P4 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, False]]                  # 16 P3 top-down

  # from is [key_value, query]; args are [query_channels, key_value_channels]
  - [[10, -1], 1, CrossAttentionBlock, [256, 1024]]  # 17 Q=P3, K/V=P5
  - [-1, 1, MSCBAMFixed, [256, 16]]                  # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                   # 19
  - [[-1, 13, 6], 1, Concat, [1]]                # 20 BiFPN tri-input
  - [-1, 2, C3k2, [512, False]]                  # 21
  - [-1, 1, MSCBAMFixed, [512, 16]]              # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 23
  - [[-1, 10], 1, Concat, [1]]                   # 24
  - [-1, 2, C3k2, [1024, True]]                  # 25 (P5/32-large)

  - [[18, 22, 25], 1, OBB, [nc, 1]]
